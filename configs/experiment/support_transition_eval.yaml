# Fresh no-prefix evaluation for the STP-OPD mechanics pilot (handoff §4.6).
# Every arm is evaluated WITHOUT the teacher prefix, on fresh seed grids,
# K=32 rollouts per prompt, prompt-macro metrics.

experiment:
  name: support_transition_eval
  objective: p1_mechanics_gate
  arms: [A0, A1, A2, A3]
  k_rollouts: 32
  seed_grid: [42, 1337, 20260813]

model:
  student: ${DTOPD_MODEL_ROOT}/Qwen3-VL-4B-Instruct
  teacher: ${DTOPD_MODEL_ROOT}/Qwen3-VL-32B-Instruct

data:
  prompt_manifest: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/rescue_screen_20260806
  prompt_count: 7
  conditions: [original, degraded, shuffled, no_image]

metrics:
  primary: jeffreys_posterior_mean_diff
  prompt_macro: true
  gates:
    p1_improved_prompts: 4
    p1_lift_a3_vs_a0: 0.10
  pass_at_k: true
  accuracy: true
  support_transition_buckets: [rare_to_stable, rare_to_no_correct]

output:
  run_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/support_transition_eval
  raw_output: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/support_transition_eval/raw
