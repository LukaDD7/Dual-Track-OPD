# STP-OPD mechanics pilot: 7 rescue-positive rare-support prompts, 4 arms,
# 60 steps (handoff docs/cc_causal_state_to_stp_handoff_20260813.md §5/§7).
# No training is launched automatically; a dry-run prints the four resolved
# arm commands (P0 gate).

experiment:
  name: support_transition_prefix_opd_pilot
  objective: mechanics_gate_a3_vs_a0
  arms: [A0, A1, A2, A3]
  steps: 60
  seed_grid: [42, 1337, 20260813]
  scaffold_schedule: [[1, 20, 0.75], [21, 40, 0.50], [41, 60, 0.25]]

model:
  student: ${DTOPD_MODEL_ROOT}/Qwen3-VL-4B-Instruct
  teacher: ${DTOPD_MODEL_ROOT}/Qwen3-VL-32B-Instruct

data:
  prompt_manifest: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/rescue_screen_20260806
  prompt_count: 7
  horizon_mode: fixed_verified_answer_free
  tokenizer_hash_expected: b5005feade74589def61d27a576ef874392651e2c92c48f26bbdab1c4cad0192

loss:
  lambda_prefix: 1.0
  lambda_distill: 1.0
  lambda_task: 1.0
  prefix_region: fkl_ce
  suffix_region: [teacher_rkl_k1, task_grpo]
  mask_contract: disjoint_independently_normalized

training:
  optimizer: adamw
  learning_rate: 1e-6
  batch_size: 2
  paired_batching: true
  decode:
    temperature: 0.7
    top_p: 0.95
  max_suffix_tokens: 512
  online_student_scorer: required

output:
  run_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/support_transition_prefix_opd_pilot
  raw_output: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/support_transition_prefix_opd_pilot/raw
  manifest: run_manifest.json
