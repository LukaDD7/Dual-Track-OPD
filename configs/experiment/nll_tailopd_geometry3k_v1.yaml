experiment:
  name: nll_tailopd_v1
  hypothesis: Higher within-prompt sampled NLL rollouts receive more OPD supervision.
  stage: opd_only
  objective: validate TailOPD as an initialization stage before identical RL continuation

models:
  student: Qwen3-VL-2B-Instruct
  teacher: Qwen3-VL-8B-Instruct
  student_path: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/models/Qwen3-VL-2B-Instruct
  teacher_path: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/models/Qwen3-VL-8B-Instruct
  student_note: >
    Qwen3-1.7B is text-only and cannot process Geometry3K images. The smallest
    available public Qwen3-VL Instruct student is Qwen3-VL-2B-Instruct.

backend:
  contract: configs/backend/verl_qwen35_v090_cu132.yaml
  root: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/fc-opd-storage/backends/verl-qwen35-v090-cu132
  launcher: examples/on_policy_distillation_trainer/run_qwen3_5_4b_fsdp.sh
  patch: patches/verl/nll_tailopd_v1.patch

environment:
  python: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/envs/va-opd-qwen35-v090-cu132-r595-v1/bin/python

paths:
  student_model: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/models/Qwen3-VL-2B-Instruct
  teacher_model: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/models/Qwen3-VL-8B-Instruct
  train_file: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/fc-opd-storage/outputs/fc_opd/geometry3k_full/train.parquet
  val_file: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/fc-opd-storage/outputs/fc_opd/geometry3k_full/train_val200.parquet
  output_root: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/fc-opd-storage/runs/nll_tailopd_v1

training:
  rollout_n: 4
  train_batch_size: 16
  total_epochs: 5
  eval_frequency: 132
  checkpoint_frequency: 132
  loss_agg_mode: seq-mean-token-mean
  distillation_loss_mode: k1
  use_policy_gradient: true
  use_task_rewards: false

hardware:
  ngpus_per_node: 2
  teacher_world_size: 2
  teacher_tp: 2
  teacher_ep: 1
  rollout_tp: 1
  rollout_num_workers: 2
  visible_gpus: 0,1,2,3

tail_opd:
  enabled_by_run:
    vanilla_opd: false
    tail_opd: true
  score_type: nll
  group_normalization: zscore_softmax
  temperature: 1.0
  eps: 1.0e-6
  score_source: old_log_probs
  detach_score: true
  zero_std_behavior: uniform
  rollout_scale_mode: mean_one

stages:
  smoke:
    total_epochs: 1
    total_steps: 3
    train_batch_size: 4
    ppo_mini_batch_size: 4
    eval_frequency: 1000000
    checkpoint_frequency: 1000000
  stability:
    total_epochs: 1
    total_steps: 30
    train_batch_size: 16
    ppo_mini_batch_size: 16
    eval_frequency: 10
    checkpoint_frequency: 10
  formal:
    total_epochs: 5
    ppo_mini_batch_size: 16
    eval_frequency: 132
    checkpoint_frequency: 132

runs:
  tail_opd:
    tail_opd_enabled: true

selection:
  primary_metric: val-core/geometry3k/acc/mean@1
  direction: maximize
  policy: select the best validation checkpoint before RL
  hard_cap_epochs: 5
  patience: 2
  min_delta_percentage_points: 0.2

future:
  comparison:
    base_student_pure_rl:
      initialization: /inspire/hdd/global_user/mengweicheng-240108120092/lzy/models/Qwen3-VL-2B-Instruct
      algorithm: GRPO
    tail_opd_student_rl:
      initialization: selected TailOPD validation checkpoint
      algorithm: GRPO
  shared_rl_protocol:
    data: Geometry3K
    reward: geometry3k verifier
    rollout_n: 8
    optimizer: same across both arms
    benchmark_entry: scripts/sft_rl/run_sftrl_benchmarks.sh
    benchmark_note: evaluate exported HF checkpoints with the same benchmark suite
  scale_path:
    - 3-step smoke
    - 30-step stability check
    - 5-epoch Geometry3K TailOPD run
    - validation checkpoint selection
    - identical GRPO continuation for base and TailOPD students
    - benchmark evaluation of both RL arms
    - optional K=8 or tau sensitivity after positive signal
    - larger multimodal dataset and DAPO robustness only after V1 go/no-go
