# Phase-5 teacher-proposal generation on the frozen 256-pool expansion manifest.
# Same budget/decoding contract as proposal_feasibility_20260805; no training.

experiment:
  name: reachability_expansion_proposals
  objective: verified_teacher_traces_for_frozen_expansion_manifest

models:
  student: ${DTOPD_MODEL_ROOT}/Qwen3-VL-4B-Instruct
  teacher: ${DTOPD_MODEL_ROOT}/Qwen3-VL-32B-Instruct
  shared_tokenizer_required: true

data:
  k32_run_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/diag_full_k32_20260804_merged
  cohort_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/k32_cohort_20260804
  pool256_run_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/diag_full_20260802_256_merged.rescored-exact-v1
  prompt_manifest: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/reachability_proxy_20260814/expansion_manifest_20260815.jsonl

selection:
  states: [no_correct_observed, rare_success, mixed_support]
  retain_count: 2

generation:
  proposals_per_prompt: 4
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 4096
  seed: 20260805
  response_format: legacy_answer

reachability:
  metric: two_sided_trimmed_length_normalized_student_nll
  low_trim_fraction: 0.10
  high_trim_fraction: 0.02
  verifier_first: true
  exact_teacher_token_ids_required: true

hardware:
  dtype: bfloat16
  # A launcher exposes one physical teacher/student pair as logical cuda:0/1.
  teacher_device: cuda:0
  student_device: cuda:1

output:
  dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/proposal_feasibility_20260815
