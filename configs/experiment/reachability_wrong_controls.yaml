# Phase-5B: fresh unaided student rollouts to source wrong controls for the
# 19 pre-scored expansion prompts.  Frozen student; no training.

experiment:
  name: reachability_wrong_controls
  objective: student_wrong_control_rollouts_for_prescored_expansion

model:
  student: ${DTOPD_MODEL_ROOT}/Qwen3-VL-4B-Instruct

data:
  manifest: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/reachability_proxy_20260814/expansion_manifest_20260815.jsonl
  proposal_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/proposal_feasibility_20260815_merged
  rescue_dirs:
    - ${DTOPD_OUTPUT_ROOT}/support_aware_opd/prefix_intervention_20260806_merged
    - ${DTOPD_OUTPUT_ROOT}/support_aware_opd/prefix_intervention_20260815_merged
  cohort_dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/k32_cohort_20260804
  cohort_parquet_path: ${DTOPD_OUTPUT_ROOT}/fc_opd/geometry3k_full/train.parquet

generation:
  k: 16
  max_continuation_tokens: 2048
  temperature: 0.7
  top_p: 0.95
  seed: 20260815
  response_format: legacy_answer

hardware:
  dtype: bfloat16
  # One physical GPU as logical cuda:0 per shard.
  device: cuda:0

output:
  dir: ${DTOPD_OUTPUT_ROOT}/support_aware_opd/wrong_control_pool_20260815
